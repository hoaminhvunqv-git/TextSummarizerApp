# Blueprint deploy Render cho backend Flask (xem docs/SPEC.md 2.3 và docs/PHASES.md "Giai đoạn 1.5").
# Render đọc file này khi tạo Web Service từ repo; giá trị secret không nằm trong git.
services:
  - type: web
    name: textsummarizer-api
    runtime: python
    rootDir: backend
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    # gunicorn bỏ qua app.run() nên phải bind explicit vào $PORT của Render.
    # --workers 1 là bắt buộc: bộ đếm Flask-Limiter nằm trong RAM (SPEC 2.2).
    startCommand: gunicorn app:app --workers 1 --threads 4 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.17
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_MODEL_SUMMARIZE
        value: gemini-3.1-flash-lite
      - key: GEMINI_TIMEOUT_SECONDS
        value: "15"
      # Quiz chậm hơn tóm tắt một bậc; để trống thì config.py vẫn default 30s,
      # ghi ra đây để giá trị chạy trên Render là giá trị nhìn thấy được.
      - key: GEMINI_QUIZ_TIMEOUT_SECONDS
        value: "30"
      - key: GEMINI_MAX_RETRY
        value: "1"
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: RATELIMIT_ENABLED
        value: "1"
      - key: RATELIMIT_STORAGE_URI
        value: memory://
      # Key bí mật: điền tay trong Render dashboard (sync:false = blueprint không mang giá trị).
      - key: GEMINI_API_KEY
        sync: false
      # Hai key này là điều kiện chạy của GĐ2-GĐ3, không còn là "chưa cần":
      # DATABASE_URL cho lịch sử + quota + quiz trên Neon, ENCRYPTION_KEY cho
      # crypto_service khi ghi/đọc văn bản gốc. Thiếu chúng, /health vẫn xanh
      # nhưng mọi request chạm DB trả 500.
      - key: DATABASE_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      # JWT_SECRET chỉ cần từ GĐ4 (tài khoản + OTP); GĐ1-GĐ3 không đọc nó.
